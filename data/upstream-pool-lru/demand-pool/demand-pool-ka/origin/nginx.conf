worker_processes 8;
pid /tmp/nginx.pid;
error_log stderr warn;
events { worker_connections 8192; }
http {
  access_log off;
  sendfile on;
  default_type application/octet-stream;
  keepalive_requests 1000;
  keepalive_timeout 60s;
  open_file_cache max=64;
  server { listen 127.0.0.1:8092; root /www; }
}
