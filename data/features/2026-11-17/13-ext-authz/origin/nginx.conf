worker_processes 8;
pid /tmp/nginx.pid;
error_log stderr warn;
events { worker_connections 8192; }
http {
  access_log off;
  sendfile on;
  default_type application/octet-stream;
  keepalive_requests 10000000;
  keepalive_timeout 600s;
  open_file_cache max=64;
  server { listen 127.0.0.1:8092; root /www; }
  server { listen 127.0.0.1:8093; location / { return 200; } }
  server { listen 127.0.0.1:8094; http2 on; root /www;
    location / { error_page 405 =200 /_authz/ok.grpc; return 405; }
    location = /_authz/ok.grpc { internal; types { } default_type application/grpc;
      add_trailer grpc-status 0 always; }
  }
}
